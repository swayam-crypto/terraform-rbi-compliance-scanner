aws_lb:
  provider: aws
  service: elb
  display_name: Classic Load Balancer

  kind: network
  canonical_type: load_balancer

  capabilities:
    - public_entry_point
    - tls_termination

  attributes:
    internal:
      name: internal
      type: boolean
      default: false
      description: Indicates whether the load balancer is internal.

  relationships:
    - subnet
    - security_group

  aliases:
    - AWS::ElasticLoadBalancing::LoadBalancer

  metadata:
    maturity: stable
    deprecated: false

aws_alb:
  provider: aws
  service: elbv2
  display_name: Application Load Balancer

  kind: network
  canonical_type: load_balancer

  capabilities:
    - public_entry_point
    - tls_termination
    - layer7_routing

  attributes:
    internal:
      name: internal
      type: boolean
      default: false
      description: Indicates whether the ALB is internal.

  relationships:
    - subnet
    - security_group
    - target_group

  aliases:
    - AWS::ElasticLoadBalancingV2::LoadBalancer

  metadata:
    maturity: stable
    deprecated: false

aws_api_gateway_rest_api:
  provider: aws
  service: apigateway
  display_name: Amazon API Gateway REST API

  kind: network
  canonical_type: api_gateway

  capabilities:
    - public_entry_point
    - api_management

  attributes: {}

  relationships:
    - lambda_function
    - vpc_link

  aliases:
    - AWS::ApiGateway::RestApi

  metadata:
    maturity: stable
    deprecated: false

aws_cloudfront_distribution:
  provider: aws
  service: cloudfront
  display_name: Amazon CloudFront Distribution

  kind: network
  canonical_type: cdn

  capabilities:
    - public_entry_point
    - global_distribution
    - caching

  attributes:
    enabled:
      name: enabled
      type: boolean
      default: true
      description: Indicates whether the distribution is enabled.

  relationships:
    - origin
    - certificate

  aliases:
    - AWS::CloudFront::Distribution

  metadata:
    maturity: stable
    deprecated: false
