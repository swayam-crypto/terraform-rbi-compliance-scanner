aws_lb:
  provider: aws
  service: elb
  display_name: Classic Load Balancer

  kind: network
  canonical_type: load_balancer

  capabilities:
    - public_entry_point
    - tls_termination

  attributes:
    internal:
      name: internal
      type: boolean
      default: false
      description: Indicates whether the load balancer is internal.

  relationships:
    - subnet
    - security_group

  aliases:
    - AWS::ElasticLoadBalancing::LoadBalancer

  metadata:
    maturity: stable
    deprecated: false

aws_alb:
  provider: aws
  service: elbv2
  display_name: Application Load Balancer

  kind: network
  canonical_type: load_balancer

  capabilities:
    - public_entry_point
    - tls_termination
    - layer7_routing

  attributes:
    internal:
      name: internal
      type: boolean
      default: false
      description: Indicates whether the ALB is internal.

  relationships:
    - subnet
    - security_group
    - target_group

  aliases:
    - AWS::ElasticLoadBalancingV2::LoadBalancer

  metadata:
    maturity: stable
    deprecated: false

aws_api_gateway_rest_api:
  provider: aws
  service: apigateway
  display_name: Amazon API Gateway REST API

  kind: network
  canonical_type: api_gateway

  capabilities:
    - public_entry_point
    - api_management

  attributes: {}

  relationships:
    - lambda_function
    - vpc_link

  aliases:
    - AWS::ApiGateway::RestApi

  metadata:
    maturity: stable
    deprecated: false

aws_cloudfront_distribution:
  provider: aws
  service: cloudfront
  display_name: Amazon CloudFront Distribution

  kind: network
  canonical_type: cdn

  capabilities:
    - public_entry_point
    - global_distribution
    - caching

  attributes:
    enabled:
      name: enabled
      type: boolean
      default: true
      description: Indicates whether the distribution is enabled.

  relationships:
    - origin
    - certificate

  aliases:
    - AWS::CloudFront::Distribution

  metadata:
    maturity: stable
    deprecated: false

aws_vpc:
  provider: aws
  service: ec2
  display_name: Amazon Virtual Private Cloud

  kind: network
  canonical_type: vpc

  capabilities:
    - network
    - private_network
    - routing

  attributes:
    cidr_block:
      name: cidr_block
      type: string
      description: IPv4 CIDR block assigned to the VPC.

    enable_dns_support:
      name: enable_dns_support
      type: boolean
      default: true
      description: Enables DNS resolution within the VPC.

    enable_dns_hostnames:
      name: enable_dns_hostnames
      type: boolean
      default: false
      description: Enables DNS hostnames for instances.

  relationships: []

  aliases:
    - AWS::EC2::VPC
    - aws:ec2/vpc:Vpc

  metadata:
    maturity: stable
    deprecated: false

aws_subnet:
  provider: aws
  service: ec2
  display_name: Amazon VPC Subnet

  kind: network
  canonical_type: subnet

  capabilities:
    - network
    - subnet

  attributes:
    cidr_block:
      name: cidr_block
      type: string
      description: CIDR block assigned to the subnet.

    map_public_ip_on_launch:
      name: map_public_ip_on_launch
      type: boolean
      default: false
      description: Automatically assign public IPs.

  relationships:
    - vpc

  aliases:
    - AWS::EC2::Subnet
    - aws:ec2/subnet:Subnet

  metadata:
    maturity: stable
    deprecated: false

