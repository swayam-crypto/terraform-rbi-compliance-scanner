aws_s3_bucket:
  provider: aws
  service: s3
  display_name: Amazon S3 Bucket

  kind: storage
  canonical_type: object_storage

  capabilities:
    - encryption
    - logging
    - versioning

  attributes:
    kms_key_id:
      name: kms_key_id
      type: string

      relationship:
        type: kms_key
        target: kms_key

    encryption:
      name: server_side_encryption_configuration
      type: object
      default: null
      description: Server-side encryption configuration.

    versioning:
      name: versioning
      type: object
      default: null
      description: Bucket versioning configuration.

    public_access:
      name: acl
      type: string
      default: private
      description: Bucket ACL.

  relationships:
    - bucket_policy
    - kms_key

  aliases:
    - AWS::S3::Bucket
    - aws:s3/bucket:Bucket

  metadata:
    maturity: stable
    deprecated: false

aws_s3_bucket_policy:
  provider: aws
  service: s3

  display_name: Bucket Policy

  kind: storage
  canonical_type: object_storage

  attributes:
    bucket:
      name: bucket
      type: string

      relationship:
        type: object_storage
        target: object_storage

  relationships: []
