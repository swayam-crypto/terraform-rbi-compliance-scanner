aws_db_instance:
  canonical_type: database
  provider: aws
  service: rds

  capabilities:
    - database
    - encryption
    - backup
    - logging

  aliases:
    - AWS::RDS::DBInstance
    - aws:rds/instance:Instance

  relationships:
    - subnet
    - security_group
    - kms_key

aws_s3_bucket:
  canonical_type: storage
  provider: aws
  service: s3

  capabilities:
    - storage
    - encryption
    - logging

  relationships:
    - bucket_policy
    - kms_key

  aliases:
    - AWS::S3::Bucket

aws_kms_key:
  canonical_type: encryption
  provider: aws
  service: kms

  capabilities:
    - encryption

  aliases:
    - AWS::KMS::Key

aws_lb:
  canonical_type: load_balancer
  provider: aws
  service: elb

  capabilities:
    - public_entry_point
    - load_balancer

aws_alb:
  canonical_type: load_balancer
  provider: aws
  service: elbv2

  capabilities:
    - public_entry_point
    - load_balancer

aws_api_gateway_rest_api:
  canonical_type: api_gateway
  provider: aws
  service: apigateway

  capabilities:
    - public_entry_point
    - api_gateway

aws_cloudfront_distribution:
  canonical_type: cdn
  provider: aws
  service: cloudfront

  capabilities:
    - public_entry_point
    - cdn
